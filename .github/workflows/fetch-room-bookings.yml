name: Päivitä huoneiden varaukset

on:
  schedule:
    - cron: '*/5 4-14 * * 1-5'    # kesäaika 7-17 Helsinki, parittomina minuutteina (0,5,10,...)
    - cron: '2-57/5 4-14 * * 1-5' # kesäaika 7-17 Helsinki, parillisina minuutteina (2,7,12,...)
    - cron: '*/5 5-15 * * 1-5'    # talviaika 7-17 Helsinki
    - cron: '2-57/5 5-15 * * 1-5' # talviaika 7-17 Helsinki, vuoroviestein
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-room-bookings
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Aseta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asenna riippuvuudet
        run: pip install requests

      - name: Hae varaukset Microsoft Graph API:sta
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ROOM_EMAILS: ${{ secrets.ROOM_EMAILS }}
        run: python scripts/fetch_room_bookings.py

      - name: Commit ja push jos muutoksia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add varaukset.json
          if git diff --staged --quiet; then
            echo "Ei muutoksia — ei committia."
          else
            git commit -m "Päivitä huoneiden varaustilanne [skip ci]"
            git push
          fi
