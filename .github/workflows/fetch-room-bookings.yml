name: Päivitä huoneiden varaukset

on:
  # Ajetaan arkipäivisin klo 7-17 Helsingin aikaa, 5 min välein.
  # Cron käyttää UTC-aikaa: kesäaikana Helsinki = UTC+3, talviaikana UTC+2.
  # Kesällä 4-14 UTC = 7-17 Helsinki. Talvella 5-15 UTC = 7-17 Helsinki.
  # Käytetään molempia, niin ajat ovat oikein vuoden ympäri.
  # Kaksi cron-riviä rinnakkain: GitHubin ruuhkasta huolimatta yleensä toinen onnistuu.
  schedule:
    - cron: '*/5 4-14 * * 1-5'    # kesäaika 7-17 Helsinki, parittomina minuutteina (0,5,10,...)
    - cron: '2-57/5 4-14 * * 1-5' # kesäaika 7-17 Helsinki, parillisina minuutteina (2,7,12,...)
    - cron: '*/5 5-15 * * 1-5'    # talviaika 7-17 Helsinki
    - cron: '2-57/5 5-15 * * 1-5' # talviaika 7-17 Helsinki, vuoroviestein
  # Mahdollistaa myös manuaalisen käynnistyksen Actions-välilehdeltä
  workflow_dispatch:

# Tarvitaan varaukset.json-tiedoston committaamiseen
permissions:
  contents: write

# Estetään päällekkäiset ajot
concurrency:
  group: fetch-room-bookings
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Aseta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asenna riippuvuudet
        run: pip install requests

      - name: Hae varaukset Microsoft Graph API:sta
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/fetch_room_bookings.py

      - name: Commit ja push jos muutoksia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add varaukset.json
          if git diff --staged --quiet; then
            echo "Ei muutoksia — ei committia."
          else
            git commit -m "Päivitä huoneiden varaustilanne [skip ci]"
            git push
          fi
